# Dev-only placeholder secrets: H2 in-memory DBs and a throwaway webhook secret.
apiVersion: v1
kind: Secret
metadata:
  name: order-db
type: Opaque
stringData:
  url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
  username: sa
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-db
type: Opaque
stringData:
  url: jdbc:h2:mem:payments;DB_CLOSE_DELAY=-1
  username: sa
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-gateway-secrets
type: Opaque
stringData:
  webhook-secret: dev-only-webhook-secret
