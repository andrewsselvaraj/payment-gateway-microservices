# In-cluster builds from GitHub using the repo's shared Dockerfile. Each BuildConfig pushes to an
# ImageStream with local lookup, so the Deployments' short image names resolve to the built image.
# Start them one at a time: oc start-build <service> --follow
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  runPolicy: Serial
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2
  source:
    type: Git
    git:
      uri: https://github.com/andrewsselvaraj/payment-gateway-microservices.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
      buildArgs:
        - name: SERVICE
          value: api-gateway
  output:
    to:
      kind: ImageStreamTag
      name: api-gateway:latest
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  triggers: []
