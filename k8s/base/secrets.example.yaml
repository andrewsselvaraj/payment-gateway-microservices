# TEMPLATE ONLY. Do not commit real values. Create the secrets with oc, e.g.
#   oc create secret generic payment-db --from-literal=url=jdbc:postgresql://<rds-endpoint>:5432/payments \
#       --from-literal=username=payments --from-literal=password='<password>'
# or sync them from AWS Secrets Manager with the External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: payment-gateway-secrets
type: Opaque
stringData:
  webhook-secret: "<random 32+ char string>"
  stripe-api-key: "<sk_live_... or sk_test_...>"
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-db
type: Opaque
stringData:
  url: jdbc:postgresql://<rds-endpoint>:5432/payments
  username: payments
  password: "<password>"
---
apiVersion: v1
kind: Secret
metadata:
  name: order-db
type: Opaque
stringData:
  url: jdbc:postgresql://<rds-endpoint>:5432/orders
  username: orders
  password: "<password>"
